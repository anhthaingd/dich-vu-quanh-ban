name: Quality
# Owner decision 12/11/2026 (B00-32): SDD is paused on push/PR to save time. It runs only when started
# manually (Actions > Quality > Run workflow, or `gh workflow run quality.yml --ref main`).
# The quick AWS infrastructure check still runs on every push to main and every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; push and manual runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: '1'
  NODE_ENV: test
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3100/v1
jobs:
  sdd-project:
    name: SDD project
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Validate the reviewed spec baseline as well as this HEAD.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-ux/prototype/package-lock.json
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm ci --prefix ui-ux/prototype
      - run: npm run sdd:check -- --change SDD-PROJECT --phase prepare
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f infra/compose.yaml --profile test up -d --wait db-test
      - run: npm run sdd:run -- --change SDD-PROJECT
      - run: npm run sdd:check -- --change SDD-PROJECT --phase verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdd-project-${{ github.sha }}
          path: |
            test-results/sdd
            test-results/mobile
            test-results/api
            test-results/web
            test-results/performance
            coverage/mobile
            coverage/api
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.yaml --profile test stop db-test
  aws-infrastructure:
    name: AWS infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install Terraform with official release checksum
        run: |
          curl --fail --silent --show-error -O https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
          curl --fail --silent --show-error -O https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_SHA256SUMS
          grep ' terraform_1.13.3_linux_amd64.zip$' terraform_1.13.3_SHA256SUMS | sha256sum -c -
          unzip terraform_1.13.3_linux_amd64.zip -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
          rm terraform_1.13.3_linux_amd64.zip terraform_1.13.3_SHA256SUMS
      - name: Validate AWS configuration without credentials
        run: |
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/bootstrap validate
          terraform -chdir=infra/aws/lab init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/lab validate
          terraform -chdir=infra/aws/lab test
      - name: Build and boot production image against isolated TLS PostGIS
        run: |
          docker build --platform linux/amd64 -f infra/aws/Dockerfile -t dvqb-api:infra-test .
          node scripts/aws/container-smoke.mjs
