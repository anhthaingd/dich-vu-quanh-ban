name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  NODE_ENV: test
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3100/v1
jobs:
  sdd-project:
    name: SDD project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Validate the reviewed spec baseline as well as this HEAD.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-ux/prototype/package-lock.json
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm ci --prefix ui-ux/prototype
      - run: npm run sdd:check -- --change SDD-PROJECT --phase prepare
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f infra/compose.yaml --profile test up -d --wait db-test
      - run: npm run sdd:run -- --change SDD-PROJECT
      - run: npm run sdd:check -- --change SDD-PROJECT --phase verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdd-project-${{ github.sha }}
          path: |
            test-results/sdd
            test-results/mobile
            test-results/api
            test-results/web
            test-results/performance
            coverage/mobile
            coverage/api
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.yaml --profile test stop db-test
