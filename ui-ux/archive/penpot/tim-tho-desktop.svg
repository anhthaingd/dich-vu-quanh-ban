<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320"><rect x="0" y="0" width="1280" height="1320" rx="0" fill="#f7f8fa" stroke="none"/><rect x="0" y="0" width="1280" height="30" rx="0" fill="#edf2ee" stroke="none"/><text x="48" y="20" font-family="Arial" font-size="10" font-weight="400" fill="#486155">BẢN THỬ UI · DỮ LIỆU MINH HỌA</text><rect x="0" y="30" width="1280" height="80" rx="0" fill="#ffffff" stroke="none"/><rect x="48" y="51" width="36" height="36" rx="10" fill="#185b48" stroke="none"/><text x="60" y="76" font-family="Arial" font-size="22" font-weight="400" fill="#fff">↗</text><text x="96" y="76" font-family="Arial" font-size="20" font-weight="700" fill="#20332d">Dịch vụ quanh bạn</text><text x="605" y="76" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Tìm dịch vụ</text><text x="740" y="76" font-family="Arial" font-size="14" font-weight="400" fill="#62716c">Công việc</text><text x="850" y="76" font-family="Arial" font-size="14" font-weight="400" fill="#62716c">Tin nhắn</text><text x="1110" y="76" font-family="Arial" font-size="14" font-weight="600" fill="#20332d">Anh Tuấn</text><text x="64" y="162" font-family="Arial" font-size="11" font-weight="700" fill="#185b48">DỊCH VỤ TẠI HÀ NỘI</text><text x="64" y="213" font-family="Arial" font-size="34" font-weight="700" fill="#20332d">Tìm người phù hợp, ngay quanh bạn.</text><text x="64" y="248" font-family="Arial" font-size="16" font-weight="400" fill="#62716c">Xem hồ sơ, trao đổi trực tiếp rồi quyết định thuê.</text><rect x="64" y="282" width="1152" height="68" rx="12" fill="#fff" stroke="#c6d3cb"/><text x="88" y="324" font-family="Arial" font-size="16" font-weight="400" fill="#62716c">Tìm dịch vụ hoặc kỹ năng…</text><rect x="765" y="298" width="1" height="36" rx="0" fill="#e2e7e4" stroke="none"/><text x="790" y="308" font-family="Arial" font-size="10" font-weight="400" fill="#62716c">Khu vực tìm kiếm</text><text x="790" y="332" font-family="Arial" font-size="14" font-weight="400" fill="#20332d">Cầu Giấy, Hà Nội</text><rect x="1040" y="294" width="164" height="44" rx="8" fill="#185b48" stroke="#bdd0c3"/><text x="1056" y="322" font-family="Arial" font-size="14" font-weight="600" fill="#ffffff">Tìm dịch vụ</text><rect x="64" y="374" width="132" height="44" rx="8" fill="#e5efe9" stroke="#cbd9d0"/><text x="84" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#185b48">Tất cả</text><rect x="208" y="374" width="132" height="44" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="228" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#53645c">Điện nước</text><rect x="352" y="374" width="132" height="44" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="372" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#53645c">Điện lạnh</text><rect x="496" y="374" width="132" height="44" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="516" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#53645c">Vệ sinh</text><rect x="640" y="374" width="132" height="44" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="660" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#53645c">Thú cưng</text><rect x="784" y="374" width="132" height="44" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="804" y="402" font-family="Arial" font-size="14" font-weight="400" fill="#53645c">Chăm xe</text><rect x="64" y="448" width="1152" height="1" rx="0" fill="#e2e7e4" stroke="none"/><text x="64" y="490" font-family="Arial" font-size="15" font-weight="600" fill="#20332d">Thu hẹp tìm kiếm</text><text x="64" y="534" font-family="Arial" font-size="13" font-weight="400" fill="#20332d">Khoảng cách</text><rect x="64" y="548" width="224" height="44" rx="8" fill="#fff" stroke="#cdd6d0"/><text x="80" y="576" font-family="Arial" font-size="14" font-weight="400" fill="#20332d">Trong 10 km         ⌄</text><rect x="64" y="614" width="16" height="16" rx="3" fill="#fff" stroke="#94a79a"/><text x="91" y="627" font-family="Arial" font-size="12" font-weight="400" fill="#20332d">Chỉ hồ sơ đã xác minh</text><text x="64" y="702" font-family="Arial" font-size="14" font-weight="600" fill="#20332d">Bạn có thể nhắn trước</text><text x="64" y="730" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">Trao đổi về việc cần làm,</text><text x="64" y="751" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">rồi quyết định thuê.</text><text x="336" y="490" font-family="Arial" font-size="23" font-weight="600" fill="#20332d">4 lựa chọn quanh bạn</text><text x="336" y="516" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">Trong 10 km từ Cầu Giấy</text><rect x="1110" y="470" width="106" height="44" rx="8" fill="#ffffff" stroke="#bdd0c3"/><text x="1126" y="498" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Bản đồ</text><text x="930" y="554" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">Sắp xếp: gần nhất trong bản thử</text><rect x="336" y="576" width="880" height="222" rx="12" fill="#ffffff" stroke="#e2e7e4"/><rect x="356" y="596" width="56" height="60" rx="10" fill="#e3eee6" stroke="none"/><text x="373" y="634" font-family="Arial" font-size="22" font-weight="600" fill="#3a6750">M</text><text x="430" y="612" font-family="Arial" font-size="19" font-weight="600" fill="#20332d">Nguyễn Văn Minh</text><text x="1131" y="612" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">1,2 km</text><text x="430" y="638" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Thợ điện nước · 8 năm kinh nghiệm</text><text x="430" y="667" font-family="Arial" font-size="13" font-weight="400" fill="#68572e">4,8 (42 đánh giá)</text><text x="631" y="667" font-family="Arial" font-size="12" font-weight="400" fill="#267048">Đã xác minh</text><text x="430" y="696" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Sửa rò nước, thay vòi và xử lý sự cố điện dân dụng.</text><rect x="430" y="717" width="762" height="1" rx="0" fill="#e2e7e4" stroke="none"/><text x="430" y="743" font-family="Arial" font-size="11" font-weight="400" fill="#62716c">Tiền công tham khảo</text><text x="430" y="769" font-family="Arial" font-size="17" font-weight="600" fill="#20332d">Từ 150.000đ</text><rect x="1042" y="736" width="150" height="44" rx="8" fill="#ffffff" stroke="#bdd0c3"/><text x="1058" y="764" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Xem hồ sơ →</text><rect x="336" y="814" width="880" height="222" rx="12" fill="#ffffff" stroke="#e2e7e4"/><rect x="356" y="834" width="56" height="60" rx="10" fill="#e3eee6" stroke="none"/><text x="373" y="872" font-family="Arial" font-size="22" font-weight="600" fill="#3a6750">AT</text><text x="430" y="850" font-family="Arial" font-size="19" font-weight="600" fill="#20332d">Điện lạnh An Tâm</text><text x="1131" y="850" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">2,4 km</text><text x="430" y="876" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Cửa hàng điện lạnh · Hoạt động từ 2017</text><text x="430" y="905" font-family="Arial" font-size="13" font-weight="400" fill="#68572e">4,9 (68 đánh giá)</text><text x="631" y="905" font-family="Arial" font-size="12" font-weight="400" fill="#267048">Đã xác minh</text><text x="430" y="934" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Vệ sinh, bảo dưỡng và sửa chữa điều hòa tại nhà.</text><rect x="430" y="955" width="762" height="1" rx="0" fill="#e2e7e4" stroke="none"/><text x="430" y="981" font-family="Arial" font-size="11" font-weight="400" fill="#62716c">Tiền công tham khảo</text><text x="430" y="1007" font-family="Arial" font-size="17" font-weight="600" fill="#20332d">Từ 180.000đ</text><rect x="1042" y="974" width="150" height="44" rx="8" fill="#ffffff" stroke="#bdd0c3"/><text x="1058" y="1002" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Xem hồ sơ →</text><rect x="336" y="1052" width="880" height="222" rx="12" fill="#ffffff" stroke="#e2e7e4"/><rect x="356" y="1072" width="56" height="60" rx="10" fill="#e3eee6" stroke="none"/><text x="373" y="1110" font-family="Arial" font-size="22" font-weight="600" fill="#3a6750">L</text><text x="430" y="1088" font-family="Arial" font-size="19" font-weight="600" fill="#20332d">Trần Thị Lan</text><text x="1131" y="1088" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">3,1 km</text><text x="430" y="1114" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Vệ sinh nhà cửa · 5 năm kinh nghiệm</text><text x="430" y="1143" font-family="Arial" font-size="13" font-weight="400" fill="#68572e">4,7 (31 đánh giá)</text><text x="631" y="1143" font-family="Arial" font-size="12" font-weight="400" fill="#267048">Đã xác minh</text><text x="430" y="1172" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Dọn nhà định kỳ, vệ sinh bếp và căn hộ.</text><rect x="430" y="1193" width="762" height="1" rx="0" fill="#e2e7e4" stroke="none"/><text x="430" y="1219" font-family="Arial" font-size="11" font-weight="400" fill="#62716c">Tiền công tham khảo</text><text x="430" y="1245" font-family="Arial" font-size="17" font-weight="600" fill="#20332d">Từ 100.000đ</text><rect x="1042" y="1212" width="150" height="44" rx="8" fill="#ffffff" stroke="#bdd0c3"/><text x="1058" y="1240" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Xem hồ sơ →</text><text x="336" y="1300" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">Giá tham khảo. Hãy thống nhất chi phí trước khi làm.</text></svg>