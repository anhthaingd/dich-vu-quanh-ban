<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1030" viewBox="0 0 390 1030"><rect x="0" y="0" width="390" height="1030" rx="0" fill="#f7f8fa" stroke="none"/><rect x="0" y="0" width="390" height="28" rx="0" fill="#edf2ee" stroke="none"/><text x="16" y="18" font-family="Arial" font-size="9" font-weight="400" fill="#486155">BẢN THỬ UI · DỮ LIỆU MINH HỌA</text><rect x="0" y="28" width="390" height="68" rx="0" fill="#ffffff" stroke="none"/><text x="20" y="70" font-family="Arial" font-size="19" font-weight="700" fill="#20332d">Dịch vụ quanh bạn</text><text x="344" y="70" font-family="Arial" font-size="16" font-weight="600" fill="#185b48">T</text><text x="20" y="136" font-family="Arial" font-size="10" font-weight="600" fill="#185b48">DỊCH VỤ TẠI HÀ NỘI</text><text x="20" y="177" font-family="Arial" font-size="28" font-weight="700" fill="#20332d">Tìm người phù hợp,</text><text x="20" y="215" font-family="Arial" font-size="28" font-weight="700" fill="#20332d">ngay quanh bạn.</text><text x="20" y="250" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Xem hồ sơ, trao đổi rồi quyết định thuê.</text><rect x="16" y="278" width="358" height="98" rx="12" fill="#fff" stroke="#c6d3cb"/><text x="32" y="311" font-family="Arial" font-size="14" font-weight="400" fill="#62716c">Bạn cần dịch vụ gì?</text><rect x="313" y="287" width="48" height="44" rx="8" fill="#185b48" stroke="#bdd0c3"/><text x="329" y="315" font-family="Arial" font-size="14" font-weight="600" fill="#ffffff">⌕</text><rect x="28" y="339" width="332" height="1" rx="0" fill="#e2e7e4" stroke="none"/><text x="32" y="362" font-family="Arial" font-size="12" font-weight="400" fill="#53645c">Khu vực: Cầu Giấy, Hà Nội</text><rect x="16" y="394" width="112" height="42" rx="8" fill="#e5efe9" stroke="#cbd9d0"/><text x="31" y="421" font-family="Arial" font-size="13" font-weight="400" fill="#185b48">Tất cả</text><rect x="138" y="394" width="112" height="42" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="153" y="421" font-family="Arial" font-size="13" font-weight="400" fill="#185b48">Điện nước</text><rect x="260" y="394" width="112" height="42" rx="8" fill="#fff" stroke="#cbd9d0"/><text x="275" y="421" font-family="Arial" font-size="13" font-weight="400" fill="#185b48">Điện lạnh</text><text x="20" y="476" font-family="Arial" font-size="13" font-weight="400" fill="#20332d">Trong 10 km  ⌄</text><text x="181" y="476" font-family="Arial" font-size="13" font-weight="400" fill="#20332d">□ Đã xác minh</text><text x="20" y="522" font-family="Arial" font-size="19" font-weight="600" fill="#20332d">4 lựa chọn quanh bạn</text><text x="301" y="522" font-family="Arial" font-size="12" font-weight="400" fill="#185b48">Bản đồ</text><rect x="16" y="546" width="358" height="318" rx="12" fill="#fff" stroke="#e2e7e4"/><rect x="34" y="566" width="44" height="48" rx="8" fill="#e3eee6" stroke="none"/><text x="47" y="597" font-family="Arial" font-size="20" font-weight="600" fill="#3a6750">M</text><text x="92" y="585" font-family="Arial" font-size="17" font-weight="600" fill="#20332d">Nguyễn Văn Minh</text><text x="92" y="609" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">Thợ điện nước · 1,2 km</text><text x="92" y="637" font-family="Arial" font-size="12" font-weight="400" fill="#62716c">8 năm kinh nghiệm</text><text x="34" y="676" font-family="Arial" font-size="12" font-weight="400" fill="#267048">4,8 (42 đánh giá)      Đã xác minh</text><text x="34" y="710" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">Sửa rò nước, thay vòi và xử lý</text><text x="34" y="732" font-family="Arial" font-size="13" font-weight="400" fill="#62716c">sự cố điện dân dụng.</text><text x="34" y="767" font-family="Arial" font-size="13" font-weight="600" fill="#20332d">Tiền công tham khảo: từ 150.000đ</text><rect x="34" y="790" width="322" height="44" rx="8" fill="#ffffff" stroke="#bdd0c3"/><text x="50" y="818" font-family="Arial" font-size="14" font-weight="600" fill="#185b48">Xem hồ sơ →</text><text x="20" y="899" font-family="Arial" font-size="11" font-weight="400" fill="#62716c">Giá tham khảo do partner cung cấp.</text><text x="20" y="920" font-family="Arial" font-size="11" font-weight="400" fill="#62716c">Thống nhất chi phí trước khi làm.</text><rect x="0" y="974" width="390" height="56" rx="0" fill="#fff" stroke="none"/><text x="20" y="1007" font-family="Arial" font-size="12" font-weight="400" fill="#53645c">Tìm kiếm       Công việc       Chat       Tài khoản</text></svg>