appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-back
- extendedWaitUntil:
    visible: "Điện nước"
    timeout: 15000
- takeScreenshot: home-storybook
- tapOn:
    id: nav-jobs
- assertVisible:
    id: account-continue-login
- takeScreenshot: home-jobs
- tapOn:
    id: nav-messages
- assertVisible:
    id: account-continue-login
- tapOn:
    id: nav-catalog
- tapOn:
    id: search-service-open
- tapOn: "Điện nước"
- tapOn: "Điện dân dụng"
- takeScreenshot: service-picker
- tapOn: "Thay ổ cắm / công tắc"
- assertVisible: "Thay ổ cắm / công tắc"
- takeScreenshot: service-selected
- tapOn:
    id: search-service-open
- tapOn:
    id: service-root
- tapOn:
    id: service-cancel
- assertVisible: "Thay ổ cắm / công tắc"
- tapOn:
    id: search-service-open
- tapOn:
    id: service-all
- assertVisible: "Sửa vòi nước, vệ sinh điều hòa…"
- scrollUntilVisible:
    element:
      id: search-filters-open
    direction: DOWN
- tapOn:
    id: search-filters-open
- assertVisible:
    id: search-radius
- tapOn:
    id: search-filters-apply
- tapOn:
    id: search-pick-location
- assertVisible:
    id: location-search
- takeScreenshot: home-location-picker
- tapOn:
    id: location-cancel
