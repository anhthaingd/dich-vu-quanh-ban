      id: locale-ja
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: locale-ja
- extendedWaitUntil:
    visible: "言語"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-vi
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: locale-vi
- extendedWaitUntil:
    visible: "Ngôn ngữ"
    timeout: 15000
- scrollUntilVisible:
