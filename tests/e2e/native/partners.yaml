appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-account
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible: "Email chưa xác minh"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: partners-open
    direction: DOWN
- tapOn:
    id: partners-open
- extendedWaitUntil:
    visible: "Native company"
    timeout: 15000
- takeScreenshot: partner-list
- scrollUntilVisible:
    element:
      id: partner-create-open
    direction: DOWN
- tapOn:
    id: partner-create-open
- takeScreenshot: partner-create
- tapOn:
    id: nav-back
- tapOn: "Native company"
- extendedWaitUntil:
    visible:
      id: partner-publication
    timeout: 15000
- takeScreenshot: partner-draft
- tapOn:
    id: partner-publication
- extendedWaitUntil:
    visible: ".*Đã công bố"
    timeout: 15000
- takeScreenshot: partner-paused
- scrollUntilVisible:
    element:
      id: partner-availability
    direction: UP
- tapOn:
    id: partner-availability
- extendedWaitUntil:
    visible: "Tắt nhận việc"
    timeout: 15000
- takeScreenshot: partner-published
- tapOn:
    id: partner-availability
- extendedWaitUntil:
    visible: "Bật nhận việc"
    timeout: 15000
- tapOn:
    id: partner-availability
- extendedWaitUntil:
    visible: "Tắt nhận việc"
    timeout: 15000
- scrollUntilVisible:
