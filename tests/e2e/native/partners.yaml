      id: search-pick-location
    direction: DOWN
- tapOn:
    id: search-pick-location
- tapOn:
    id: location-query
- inputText: "DEMO public test address"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: location-result-0
    timeout: 15000
- tapOn:
    id: location-result-0
- tapOn:
    id: location-confirm
- scrollUntilVisible:
    element:
      id: search-submit
    direction: DOWN
- takeScreenshot: partner-search-form
