      id: skill-mode-0-at_customer
    direction: DOWN
- takeScreenshot: partner-skills
- scrollUntilVisible:
    element:
      id: partner-section-areas
    direction: UP
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: partner-section-areas
- scrollUntilVisible:
    element:
      id: partner-save-areas
    direction: DOWN
- takeScreenshot: partner-areas
- scrollUntilVisible:
