appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- eraseText
- inputText: ${TEST_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- eraseText
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible: "Email chưa xác minh"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: partners-open
    direction: DOWN
- tapOn:
    id: partners-open
- tapOn: "DEMO local gallery"
- scrollUntilVisible:
    element:
      id: partner-section-gallery
    direction: DOWN
- tapOn:
    id: partner-section-gallery
- scrollUntilVisible:
    element:
      id: gallery-up-1
    direction: DOWN
- tapOn:
    id: gallery-up-1
- takeScreenshot: approved-gallery-order
- scrollUntilVisible:
    element:
      id: gallery-remove-0
    direction: UP
- tapOn:
    id: gallery-remove-0
- scrollUntilVisible:
    element:
      id: gallery-save
    direction: DOWN
- tapOn:
    id: gallery-save
- scrollUntilVisible:
    element:
      id: partner-availability
    direction: UP
- tapOn:
    id: partner-availability
- extendedWaitUntil:
    visible: "Bật nhận việc"
    timeout: 15000
- takeScreenshot: approved-paused
- tapOn:
    id: nav-back
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element:
      id: auth-logout
    direction: DOWN
- tapOn:
    id: auth-logout
- tapOn:
    id: nav-back
- tapOn:
    id: nav-account
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- eraseText
- inputText: ${ADMIN_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- eraseText
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: admin-password
    timeout: 15000
- tapOn:
    id: admin-recovery-toggle
- tapOn:
    id: admin-password
- eraseText
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- tapOn:
    id: admin-code
- inputText: ${BACKUP_CODE}
- pressKey: Enter
- tapOn:
    id: admin-verify
- extendedWaitUntil:
    visible:
      id: mfa-security-toggle
    timeout: 20000
- tapOn:
    id: mfa-security-toggle
- scrollUntilVisible:
    element:
      id: mfa-target
    direction: DOWN
- takeScreenshot: approved-mfa-security
