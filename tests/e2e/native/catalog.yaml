appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Bạn cần dịch vụ gì?"
    timeout: 60000
- scrollUntilVisible:
    element: "Điện nước"
    direction: DOWN
    centerElement: true
- tapOn: "Điện nước"
- tapOn: "Dịch vụ điện nước"
- assertVisible: "Sửa điện dân dụng"
- takeScreenshot: skills
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "90%, 50%"
          duration: 500
- assertVisible: "Dịch vụ điện nước"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Dịch vụ điện nước"
- tapOn: "Dịch vụ điện nước"
- runScript:
    file: set-mode.js
    env:
      MODE: error
- tapOn: "Quay lại"
- assertVisible: "Không tải được danh mục.*"
- takeScreenshot: error
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- tapOn: "Thử lại"
- assertVisible: "Dịch vụ điện nước"
- runScript:
    file: set-mode.js
    env:
      MODE: empty
- tapOn: "Quay lại"
- assertVisible: "Chưa có dịch vụ đang hoạt động."
- takeScreenshot: empty
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "Điện nước"
    timeout: 30000
- takeScreenshot: recovered
