appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-back
- tapOn:
    id: search-service-open
- tapOn: "Điện nước"
- tapOn: "Điện dân dụng"
- assertVisible: "Thay ổ cắm / công tắc"
- takeScreenshot: skills
- tapOn:
    id: service-parent
- assertVisible: "Điện dân dụng"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Điện dân dụng"
- tapOn: "Điện dân dụng"
- runScript:
    file: set-mode.js
    env:
      MODE: error
- tapOn:
    id: service-parent
- assertVisible: "Không tải được danh mục.*"
- takeScreenshot: error
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- tapOn: "Thử lại"
- assertVisible: "Điện dân dụng"
- tapOn:
    id: service-cancel
- runScript:
    file: set-mode.js
    env:
      MODE: empty
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "Chưa có dịch vụ đang hoạt động."
    timeout: 30000
- takeScreenshot: empty
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "Điện nước"
    timeout: 30000
- takeScreenshot: recovered
