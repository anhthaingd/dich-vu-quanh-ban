appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible: "Email chưa xác minh"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: profile-open
    direction: DOWN
- tapOn:
    id: profile-open
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 15000
- tapOn:
    id: profile-name
- eraseText
- inputText: "Profile native updated"
- assertVisible: "Profile native updated"
- pressKey: Enter
- assertVisible: "Profile native updated"
- scrollUntilVisible:
    element:
      id: locale-en
    direction: UP
- tapOn:
    id: locale-en
- assertVisible: "Profile native updated"
- tapOn:
    id: locale-ja
- assertVisible: "Profile native updated"
- tapOn:
    id: locale-vi
- scrollUntilVisible:
    element:
      id: profile-save
    direction: DOWN
- tapOn:
    id: profile-save
- extendedWaitUntil:
    visible:
      id: profile-saved
    timeout: 15000
- takeScreenshot: profile-saved
- scrollUntilVisible:
    element:
      id: nav-back
    direction: UP
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element: "Profile native updated"
    direction: UP
    centerElement: true
- assertVisible: "Profile native updated"
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- assertVisible: "Profile native updated"
- takeScreenshot: profile-restored
