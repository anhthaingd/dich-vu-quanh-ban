appId: vn.dichvuquanhban.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      # iOS 27 on iPhone 18 Pro exposes the system Save Password sheet's
      # elements as "0%" instead of labels. Screenshot-verified fallback for
      # this simulator; never save the disposable test credentials to Passwords.
      - runFlow:
          when:
            visible: "0%"
          commands:
            - tapOn:
                point: "32%,63%"
