appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-en
    direction: UP
- tapOn:
    id: locale-en
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
# Enter blurs the input without Android Back accidentally leaving the screen.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: "wrong-test-password"
# The password input submits through onSubmitEditing on both platforms.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Unable to authenticate.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- assertVisible: "認証できません.*"
- takeScreenshot: localized-error
- tapOn:
    id: nav-back
- tapOn:
    id: search-service-open
- tapOn: "電気・水道"
- assertVisible: "家庭の電気工事"
- tapOn:
    id: service-cancel
- tapOn:
    id: nav-account
- tapOn:
    id: locale-en
- tapOn:
    id: nav-back
- tapOn:
    id: search-service-open
- tapOn: "Electrical & plumbing"
- tapOn: "Home electrical work"
- assertVisible: "Socket & switch replacement"
- takeScreenshot: catalog-localized
- runScript:
    file: set-mode.js
    env:
      MODE: error
- tapOn:
    id: service-parent
- assertVisible: "Unable to load services.*"
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- tapOn: "Try again"
- tapOn:
    id: service-cancel
- tapOn:
    id: nav-account
- tapOn:
    id: locale-ja
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "暮らしの困りごとに.*"
    timeout: 60000
- assertVisible: "電気・水道"
- takeScreenshot: restored-japanese
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-back
- assertVisible: "Việc nhà có người lo.*"
