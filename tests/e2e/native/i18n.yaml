appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-account
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 15000
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: "wrong-test-password"
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- assertVisible: "アカウント"
- tapOn:
    id: locale-en
- scrollUntilVisible:
    element:
      id: auth-submit
    direction: DOWN
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: "Unable to authenticate.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- assertVisible: "認証できません.*"
- takeScreenshot: localized-error
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element: "Điện nước"
    direction: DOWN
- tapOn: "Điện nước"
- assertVisible: "Dịch vụ điện nước"
- scrollUntilVisible:
    element:
      id: locale-en
    direction: UP
- tapOn:
    id: locale-en
- assertVisible: "Điện nước"
- assertVisible: "[0-9]+ skills"
- takeScreenshot: catalog-fallback
- runScript:
    file: set-mode.js
    env:
      MODE: error
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element: "Unable to load services.*"
    direction: DOWN
- assertVisible: "Unable to load services.*"
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- tapOn: "Try again"
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "どんなサービスをお探しですか？"
    timeout: 60000
- scrollUntilVisible:
    element: "Điện nước"
    direction: DOWN
- assertVisible: "Điện nước"
- takeScreenshot: restored-japanese
- scrollUntilVisible:
    element:
      id: locale-vi
    direction: UP
- tapOn:
    id: locale-vi
- assertVisible: "Bạn cần dịch vụ gì?"
