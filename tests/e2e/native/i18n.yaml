appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-account
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-en
    direction: UP
- tapOn:
    id: locale-en
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
# Enter blurs the input without Android Back accidentally leaving the screen.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: "wrong-test-password"
# The password input submits through onSubmitEditing on both platforms.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Unable to authenticate.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- assertVisible: "認証できません.*"
- takeScreenshot: localized-error
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element: "電気・水道"
    direction: DOWN
- tapOn: "電気・水道"
- assertVisible: "家庭の電気工事"
- scrollUntilVisible:
    element:
      id: locale-en
    direction: UP
- tapOn:
    id: locale-en
- extendedWaitUntil:
    visible: "Electrical & plumbing"
    timeout: 15000
- assertVisible: "Home electrical work"
- tapOn: "Home electrical work"
- scrollUntilVisible:
    element: "Socket & switch replacement"
    direction: DOWN
- assertVisible: "Socket & switch replacement"
- takeScreenshot: catalog-localized
- runScript:
    file: set-mode.js
    env:
      MODE: error
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element: "Unable to load services.*"
    direction: DOWN
- assertVisible: "Unable to load services.*"
- runScript:
    file: set-mode.js
    env:
      MODE: ok
- tapOn: "Try again"
- scrollUntilVisible:
    element:
      id: locale-ja
    direction: UP
- tapOn:
    id: locale-ja
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "どんなサービスをお探しですか？"
    timeout: 60000
- scrollUntilVisible:
    element: "電気・水道"
    direction: DOWN
- assertVisible: "電気・水道"
- takeScreenshot: restored-japanese
- scrollUntilVisible:
    element:
      id: locale-vi
    direction: UP
- tapOn:
    id: locale-vi
- assertVisible: "Bạn cần dịch vụ gì?"
