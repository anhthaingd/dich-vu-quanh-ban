appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: nav-account
- tapOn:
    id: locale-vi
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible: "Email chưa xác minh"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: security-open
    direction: DOWN
- tapOn:
    id: security-open
- assertVisible: "Bảo mật tài khoản"
- takeScreenshot: p2-security
- tapOn: "Quay lại"
- scrollUntilVisible:
    element:
      id: partners-open
    direction: DOWN
- tapOn:
    id: partners-open
- extendedWaitUntil:
    visible: "DEMO P2 Wallet"
    timeout: 15000
- tapOn:
    id: "wallet-open-.*"
- extendedWaitUntil:
    visible:
      id: finance-bank
    timeout: 20000
- takeScreenshot: p2-wallet
- tapOn:
    id: finance-bank
- extendedWaitUntil:
    visible:
      id: finance-bank-code
    timeout: 15000
- takeScreenshot: p2-bank
