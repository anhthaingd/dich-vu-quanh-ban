appId: vn.dichvuquanhban.app
---
- stopApp
- openLink: ${DEV_URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: nav-account
    timeout: 60000
- tapOn:
    id: locale-vi
- tapOn:
    id: nav-account
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- inputText: ${TEST_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible: "Email chưa xác minh"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: jobs-open
    direction: DOWN
- tapOn:
    id: jobs-open
- tapOn:
    id: "jobs-partner-.*"
- scrollUntilVisible:
    element:
      id: "job-open-.*"
    direction: DOWN
- tapOn:
    id: "job-open-.*"
- scrollUntilVisible:
    element:
      id: job-invoice
    direction: DOWN
- tapOn:
    id: job-invoice
- scrollUntilVisible:
    element:
      id: invoice-photo
    direction: DOWN
- scrollUntilVisible:
    element:
      id: invoice-materials
    direction: DOWN
- takeScreenshot: invoice-editor
- tapOn:
    id: invoice-materials
- eraseText
- inputText: "50000"
- tapOn: "2. Chi phí đã thống nhất"
- scrollUntilVisible:
    element:
      id: invoice-send
    direction: DOWN
- tapOn:
    id: invoice-send
- extendedWaitUntil:
    notVisible:
      id: invoice-editor
    timeout: 15000
- runScript:
    file: invoice-confirm.js
- tapOn:
    id: nav-back
- scrollUntilVisible:
    element:
      id: job-invoice
    direction: DOWN
- tapOn:
    id: job-invoice
- scrollUntilVisible:
    element:
      id: invoice-receive-check
    direction: DOWN
- takeScreenshot: invoice-payment
- tapOn:
    id: invoice-receive-check
- scrollUntilVisible:
    element:
      id: invoice-receive
    direction: DOWN
- tapOn:
    id: invoice-receive
- extendedWaitUntil:
    visible: "Đã ghi nhận nhận tiền. Chờ khách báo đã thanh toán."
    timeout: 15000
- takeScreenshot: invoice-received
